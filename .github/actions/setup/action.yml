name: Setup build environment
description: Go, Wails CLI and, on Linux, the GTK/WebKit headers

inputs:
  cache:
    description: Enable the Go module/build cache (disable for release builds)
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
        cache: ${{ inputs.cache }}

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          pkg-config \
          libgtk-4-dev \
          libwebkitgtk-6.0-dev

    - name: Install Wails CLI
      shell: bash
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
